<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="أذكار الرقية والتحصين: أدعية نبوية وآيات إبطال السحر مع عداد تفاعلي ينتقل تلقائياً للذكر التالي"><title>أذكار الرقية والتحصين</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2a26;--mute:#7a7467;--acc:#1f6f5c;--accsoft:#dcece6;--line:#e4dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2320;--ink:#ece8dc;--mute:#9a9a8e;--acc:#4fb79b;--accsoft:#223a33;--line:#2a3430}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2320;--ink:#ece8dc;--mute:#9a9a8e;--acc:#4fb79b;--accsoft:#223a33;--line:#2a3430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Traditional Arabic","Geeza Pro",serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mute);font-family:system-ui,sans-serif}
.bar{height:6px;background:var(--line);border-radius:9px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
h1{font-size:22px;margin:0 0 4px;color:var(--acc)}
.src{font-size:15px;color:var(--mute);margin-bottom:12px}
.txt{font-size:26px;line-height:2.2;text-align:center;margin:8px 0 14px}
.mean{font-size:17px;line-height:1.8;color:var(--mute);border-top:1px dashed var(--line);padding-top:10px}
.mean b{color:var(--ink)}
.tap{display:block;margin:20px auto 10px;width:150px;height:150px;border-radius:50%;border:0;background:var(--accsoft);color:var(--acc);font-family:inherit;cursor:pointer;box-shadow:inset 0 0 0 4px var(--acc);transition:transform .08s}
.tap:active{transform:scale(.94)}
.tap span{display:block;font-size:54px;font-weight:700;line-height:1}
.tap small{font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.nav button,.again{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:18px;cursor:pointer}
.done{text-align:center;padding:30px 10px}
.done h1{font-size:28px}
.again{background:var(--acc);color:#fff;border:0;max-width:220px;margin-top:12px}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
var G=[["الإخلاص","سورة الإخلاص","قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","إثبات وحدانية الله وصمديته وتنزيهه عن الولد والوالد والمثيل."],["الفلق","سورة الفلق","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","الاستعاذة برب الصبح من شر المخلوقات، ومن ظلمة الليل، ومن شر الساحرات اللاتي ينفثن في العقد، ومن شر الحاسد إذا حسد."],["الناس","سورة الناس","قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ","الاستعاذة برب الناس وملكهم وإلههم من شر الشيطان الوسواس الخنّاس، الذي يوسوس في صدور الناس من الجن والإنس."]];
var D=[
{t:"دعاء الشفاء العظيم",s:"دعاء نبوي",x:"أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَنِي",m:"طلب الشفاء من الله العظيم رب العرش العظيم للنفس. وللمريض يُقال: «أَنْ يَشْفِيَكَ».",n:7},
{t:"التسمية والاستعاذة (أ)",s:"ضع يدك على موضع الألم",x:"بِسْمِ اللَّهِ",m:"ضع يدك على موضع الألم وابدأ بالتسمية ثلاثاً.",n:3},
{t:"التسمية والاستعاذة (ب)",s:"ضع يدك على موضع الألم",x:"أَعُوذُ بِعِزَّةِ اللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ",m:"الاستعاذة بعزة الله وقدرته من شر ما يجد الإنسان ويحاذر.",n:7},
{t:"دعاء إزالة البأس",s:"دعاء نبوي",x:"اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِ وَأَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا",m:"مناجاة الله رب الناس لإذهاب البأس والمرض، وطلب الشفاء التام الذي لا يترك أثراً للسقم، إذ لا شافي سواه.",n:3},
{t:"التعوذ بكلمات الله التامات (1)",s:"تعوذ نبوي",x:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",m:"من كل شيطان وهامّة (ذوات السموم)، ومن كل عين لامّة (تصيب بسوء).",n:3},
{t:"التعوذ بكلمات الله التامات (2)",s:"تعوذ نبوي",x:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",m:"الاستعاذة بكلمات الله التامات من شر جميع المخلوقات.",n:3},
{t:"التعوذ بكلمات الله التامات (3)",s:"تعوذ نبوي",x:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ",m:"من غضب الله وعقابه، ومن شر عباده، ومن وساوس الشياطين وحضورهم.",n:3},
{t:"التعوذ بكلمات الله التامات (4)",s:"تعوذ نبوي",x:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لَا يُجَاوِزُهُنَّ بَرٌّ وَلَا فَاجِرٌ، مِنْ شَرِّ مَا خَلَقَ وَذَرَأَ وَبَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَمِنْ شَرِّ مَا يَعْرُجُ فِيهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الْأَرْضِ وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ",m:"التي لا يتجاوزها بر ولا فاجر، من شر ما خلق الله ونشر في الأرض وما ينزل من السماء ويصعد إليها، ومن فتن الليل والنهار، ومن شر كل طارق إلا طارقاً يأتي بخير.",n:1},
{t:"دعاء التحصين بصفات الله",s:"دعاء نبوي",x:"اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْقُرْآنِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ، أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ",m:"التوجه إلى رب السماوات السبع والعرش العظيم للاستعاذة من شر كل دابة ومخلوق تحت سلطان الله، مع الثناء على الله بأسمائه الأول والآخر والظاهر والباطن.",n:1},
{t:"رقية جبريل عليه السلام",s:"رقية نبوية",x:"بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ",m:"الرقية باسم الله للوقاية من كل ما يؤذي، ومن شر كل نفس حاسدة أو عين عائن، وطلب الشفاء والبرء من كل داء.",n:3},
{t:"سورة الفاتحة",s:"أول سورة في المصحف الشريف",x:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",m:"أم الكتاب والرقية الشافية؛ ثناء على الله، وإفراده بالعبادة والاستعانة، وطلب الهداية إلى الصراط المستقيم.",n:7},
{t:"آية الكرسي",s:"سورة البقرة، الآية 255",x:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",m:"أعظم آية في كتاب الله؛ الله حي قائم على شؤون خلقه، لا تأخذه سِنة ولا نوم، له ملك السماوات والأرض، لا يشفع أحد عنده إلا بإذنه، يحيط علمه بماضي الخلق ومستقبلهم.",n:1},
{t:"خواتيم سورة البقرة",s:"سورة البقرة، الآيتان 285 و286",x:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",m:"تصديق الرسول والمؤمنين بالله وملائكته وكتبه ورسله، وأن الله لا يكلف نفساً إلا وسعها، وتختتم بدعاء جامع بالمغفرة والعفو والرحمة والنصر.",n:1},
{t:"آيات إبطال السحر: الأعراف",s:"سورة الأعراف، الآيات 117 إلى 122",x:"وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنْ أَلْقِ عَصَاكَ ۖ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ ۝ فَوَقَعَ الْحَقُّ وَبَطَلَ مَا كَانُوا يَعْمَلُونَ ۝ فَغُلِبُوا هُنَالِكَ وَانقَلَبُوا صَاغِرِينَ ۝ وَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ ۝ قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝ رَبِّ مُوسَىٰ وَهَارُونَ",m:"أمر الله موسى بإلقاء عصاه فابتلعت ما زوّره السحرة، فظهر الحق وبطل سحرهم، وخرّ السحرة ساجدين مؤمنين برب العالمين.",n:1},
{t:"آيات إبطال السحر: يونس",s:"سورة يونس، الآيتان 81 و82",x:"فَلَمَّا أَلْقَوْا قَالَ مُوسَىٰ مَا جِئْتُم بِهِ السِّحْرُ ۖ إِنَّ اللَّهَ سَيُبْطِلُهُ ۖ إِنَّ اللَّهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ ۝ وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ",m:"موسى عليه السلام يعلن أن ما جاء به السحرة سحر باطل سيبطله الله، وأن الله يُحق الحق بكلماته ولو كره المجرمون.",n:1},
{t:"تكرار عبارة إبطال السحر",s:"من سورة يونس، الآية 81",x:"مَا جِئْتُم بِهِ السِّحْرُ ۖ إِنَّ اللَّهَ سَيُبْطِلُهُ ۖ إِنَّ اللَّهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ",m:"تُكرَّر ثلاث مرات.",n:3},
{t:"آيات إبطال السحر: طه",s:"سورة طه، الآيات 65 إلى 70",x:"قَالُوا يَا مُوسَىٰ إِمَّا أَن تُلْقِيَ وَإِمَّا أَن نَّكُونَ أَوَّلَ مَنْ أَلْقَىٰ ۝ قَالَ بَلْ أَلْقُوا ۖ فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِن سِحْرِهِمْ أَنَّهَا تَسْعَىٰ ۝ فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُّوسَىٰ ۝ قُلْنَا لَا تَخَفْ إِنَّكَ أَنتَ الْأَعْلَىٰ ۝ وَأَلْقِ مَا فِي يَمِينِكَ تَلْقَفْ مَا صَنَعُوا ۖ إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ ۖ وَلَا يُفْلِحُ السَّاحِرُ حَيْثُ أَتَىٰ ۝ فَأُلْقِيَ السَّحَرَةُ سُجَّدًا قَالُوا آمَنَّا بِرَبِّ هَارُونَ وَمُوسَىٰ",m:"تخييل السحرة بأن حبالهم وعصيهم تسعى، وخوف موسى، فطمأنه الله بأنه الأعلى، وأمره بإلقاء ما في يمينه لتلتقف ما صنعوا، فسجد السحرة وآمنوا.",n:1},
{t:"تكرار آية عدم فلاح الساحر",s:"من سورة طه، الآية 69",x:"إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ ۖ وَلَا يُفْلِحُ السَّاحِرُ حَيْثُ أَتَىٰ",m:"تُكرَّر ثلاث مرات.",n:3},
{t:"سورة الكافرون",s:"الجزء الثلاثون، رقم 109 في المصحف",x:"قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ ۝ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ",m:"إعلان البراءة التامة من الشرك والمشركين، وتأكيد التوحيد الخالص لله وحده.",n:1}
];
for(var r=1;r<=3;r++)G.forEach(function(g){D.push({t:"المعوذات: "+g[0],s:g[1]+" — الدورة "+r+" من 3",x:g[2],m:g[3],n:1})});
var i=0,c=0,fin=false,busy=false,el=document.getElementById("app");
function esc(s){return s}
function render(){
if(fin){el.innerHTML='<div class="card done"><h1>تقبّل الله منك</h1><p class="mean">أتممت الأذكار كاملة. نسأل الله لك الشفاء والحفظ.</p><button class="again" onclick="restart()">إعادة من البداية</button></div>';return}
var d=D[i],left=d.n-c;
el.innerHTML='<div class="top"><span>'+(i+1)+' / '+D.length+'</span><span>أذكار الرقية والتحصين</span></div><div class="bar"><i style="width:'+(i/D.length*100)+'%"></i></div>'+
'<div class="card"><h1>'+d.t+'</h1><div class="src">'+d.s+'</div><div class="txt">'+d.x+'</div><div class="mean"><b>المضمون:</b> '+d.m+'</div>'+
'<button class="tap" onclick="tap()"><span>'+left+'</span><small>من '+d.n+' · اضغط</small></button></div>'+
'<div class="nav"><button onclick="go(1)">السابق ›</button><button onclick="go(-1)">‹ التالي</button></div>';
window.scrollTo(0,0)}
function tap(){if(busy)return;c++;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
if(c>=D[i].n){busy=true;render();setTimeout(function(){busy=false;next()},350)}else render()}
function next(){c=0;if(i>=D.length-1){fin=true}else i++;render()}
function go(dir){if(dir===-1){next();return}c=0;if(i>0)i--;render()}
function restart(){i=0;c=0;fin=false;render()}
render();
</script>
